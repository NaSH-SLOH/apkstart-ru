# Русский форк: сборка только лёгкой портативной версии (~97 МБ).
# Оригинальный job «full» (среда выполнения внутри пакета, 1.4 ГБ, ~40 мин
# на xz-компрессию) удалён — для перевода он не нужен, а среда выполнения
# докачивается при первом запуске.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 构建便携版并发布
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖（含 Electron 运行时）
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 测试
        run: npm test

      - name: 打包便携版
        run: npm run pack

      # 用 7-Zip 而不是 Compress-Archive：同一个目录，.NET deflate 压出来 105MB，
      # 7-Zip -mx=9 只要 99.6MB —— 差这 5MB 就决定 Gitee 上放的是「一个能直接解压的
      # zip」还是「两个必须手工拼接的 part」。build/zip.js 还带体积闸门：超过
      # 100MiB 直接让 job 失败，避免以后又悄悄退回分片包。
      - name: 压缩产物（7-Zip，体积闸门 100MiB）
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          node build/zip.js dist/ApkStart-win64-portable "ApkStart-$tag-win64-portable.zip" --limit-mb 100
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Item "ApkStart-$tag-win64-portable.zip" | Select-Object Name, Length

      # 创建 Release 并上传轻量便携版（壳层极小，运行时首次启动按需下载）
      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { $tag = "v$tag" }
          $zip = "ApkStart-$tag-win64-portable.zip"
          # 幂等：release 已存在（如重跑 / 重推 tag）就跳过 create，只上传资产
          $existing = gh release view $tag --json tagName -q .tagName 2>$null
          # 有手写的发版说明就用它（.github/release-notes-<tag>.md），比 --generate-notes
          # 的「Full Changelog」有用得多；没有才退回自动生成。
          $notes = ".github/release-notes-$tag.md"
          if (-not $existing) {
            if (Test-Path $notes) {
              gh release create $tag --title "ApkStart $tag" --notes-file $notes
            } else {
              gh release create $tag --title "ApkStart $tag" --generate-notes
            }
            if ($LASTEXITCODE -ne 0) { exit 1 }
          } else {
            # Релиз уже есть — обновляем описание, иначе правки в файле заметок
            # никогда не доедут до опубликованной страницы (create пропускается).
            if (Test-Path $notes) {
              gh release edit $tag --notes-file $notes
              if ($LASTEXITCODE -ne 0) { Write-Error "не удалось обновить описание релиза"; exit 1 }
            }
          }
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            gh release upload $tag $zip --clobber
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 15 }
          }
          if (-not $ok) { Write-Error "上传失败: $zip"; exit 1 }
          gh release view $tag --json assets --jq '.assets[].name'